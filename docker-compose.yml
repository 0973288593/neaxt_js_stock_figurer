version: '3.7' # กำหนด docker version
services:
  # web-app: # ตั้งชื่อ container (เหมือน --name)
  #   container_name: nextjs
  #   build: . # ตำแหน่ง dockerfile
  #   ports:
  #     - "3000:3000" # map port ออกมา เหมือน -p ใน docker run 
  db:
    image: mysql:8.0 
    restart: always
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: model_ceopla
    ports:
      - "3307:3306"
    volumes:
      - .data/mysql_dataceopla:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: db # ระบุ host ที่จะให้ phpmyadmin ไปจัดการ ซึ่งสามารถใส่เป็นชื่อ container name (db) ได้เลย
      PMA_PORT: 3306 # ระบุ port ของ Database
      PMA_USER: root # ระบุ user ของ Database
      PMA_PASSWORD: root # ระบุ password ของ Database
    ports:
      - "8080:80"
    depends_on:
      - db
volumes:
  mysql_dataceopla: # กำหนดชื่อ volume ที่ต้องการจะสร้าง
    driver: local